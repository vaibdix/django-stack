name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: gofmt
        if: runner.os != 'Windows'
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: make test-race

      - name: coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: engine is TUI-free
        run: make arch

      - name: no ignored file is tracked
        run: make repo-clean

      - name: no comments in Go or repo config
        run: make comments

      - name: goldens are up to date
        run: make goldens-check

      - name: govulncheck
        run: make vulncheck

  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - uses: astral-sh/setup-uv@v6

      - name: install Python 3.13 for the generated project
        run: uv python install 3.13

      - name: generate and verify a project
        run: make test-generate

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: go test ./test/...
        run: go test ./test/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: read the pinned golangci-lint version
        id: lint-version
        run: echo "version=v$(make -s print-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ steps.lint-version.outputs.version }}
          install-only: true

      - name: golangci-lint
        run: make lint
