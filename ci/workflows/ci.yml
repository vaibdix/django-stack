name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: astral-sh/setup-uv@v10.3.2

      - name: install Python 3.13 for the generated-code tests
        run: uv python install 3.13

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: make test-race

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  cross:
    name: cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: vet and compile for windows, darwin and linux
        run: make cross

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: engine is TUI-free
        run: make arch

      - name: no ignored file is tracked
        run: make repo-clean

      - name: no comments in Go or repo config
        run: make comments

      - name: goldens are up to date
        run: make goldens-check

      - name: govulncheck
        run: make vulncheck

  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: astral-sh/setup-uv@v10.3.2

      - name: install Python 3.13 for the generated project
        run: uv python install 3.13

      - name: generate and verify a project
        run: make test-generate

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go test ./test/...
        run: go test ./test/...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: read the pinned golangci-lint version
        id: lint-version
        run: echo "version=v$(make -s print-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
          install-only: true

      - name: golangci-lint
        run: make lint
