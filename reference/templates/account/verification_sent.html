{% extends "base.html" %}
{% block title %}Verify Your Email{% endblock %}
{% block content %}
    <section class="flex min-h-[50vh] items-center justify-center px-5 py-8">
        <div class="panel w-full max-w-[420px] p-6">
            <h2>Check your inbox</h2>
            <p class="mb-6 text-body">We sent a verification link to the address you signed up with. Follow it to finish creating your account.</p>
            <a href="{% url 'account_login' %}" class="button button-primary w-full">Back to sign in</a>
        </div>
    </section>
{% endblock %}
