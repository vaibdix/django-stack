<form method="post"
      hx-post="{{ request.path }}"
      hx-target="this"
      hx-swap="outerHTML"
      class="panel p-6 max-lg:p-5">
    {% csrf_token %}
    {% include "catalog/partials/book_fields.html" %}
    <div class="mt-6 flex gap-2 border-t border-rule pt-6 max-sm:flex-col">
        <a href="{% url 'catalog:book_list' %}"
           class="button button-secondary flex-1">Cancel</a>
        <button type="submit" class="button button-primary flex-1">{{ action }} book</button>
    </div>
</form>
