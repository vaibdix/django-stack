<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - API Documentation</title>
    <style>:root {
    --body: #6b6375;
    --heading: #08060d;
    --ground: #fff;
    --rule: #e5e4e7;
    --code-bg: #f4f3ec;
    --accent: #aa3bff;
    --accent-bg: rgba(170, 59, 255, 0.1);
    --accent-border: rgba(170, 59, 255, 0.5);
    --surface: rgba(244, 243, 236, 0.5);
    --shadow:
        rgba(0, 0, 0, 0.1) 0 10px 15px -3px, rgba(0, 0, 0, 0.05) 0 4px 6px -2px;

    --font-sans: system-ui, 'Segoe UI', Roboto, sans-serif;
    --font-heading: system-ui, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, Consolas, monospace;

    --frame: 1126px;

    font: 16px/150% var(--font-sans);
    letter-spacing: 0.18px;
    color-scheme: light dark;
    color: var(--body);
    background: var(--ground);
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

@media (max-width: 1024px) {
    :root { font-size: 15px; }
}

@media (prefers-color-scheme: dark) {
    :root {
        --body: #9ca3af;
        --heading: #f3f4f6;
        --ground: #16171d;
        --rule: #2e303a;
        --code-bg: #1f2028;
        --accent: #c084fc;
        --accent-bg: rgba(192, 132, 252, 0.15);
        --accent-border: rgba(192, 132, 252, 0.5);
        --surface: rgba(47, 48, 58, 0.5);
        --shadow:
            rgba(0, 0, 0, 0.4) 0 10px 15px -3px, rgba(0, 0, 0, 0.25) 0 4px 6px -2px;
    }
}

* { box-sizing: border-box; }

body { margin: 0; }

h1, h2, h3 {
    font-family: var(--font-heading);
    font-weight: 500;
    color: var(--heading);
}

h1 {
    font-size: 42px;
    letter-spacing: -1.26px;
    line-height: 105%;
    margin: 24px 0;
}
@media (max-width: 1024px) {
    h1 { font-size: 30px; margin: 20px 0; }
}

h2 {
    font-size: 21px;
    line-height: 118%;
    letter-spacing: -0.24px;
    margin: 0 0 8px;
}
@media (max-width: 1024px) {
    h2 { font-size: 18px; }
}

h3 {
    font-size: 17px;
    line-height: 125%;
    letter-spacing: -0.2px;
    margin: 0 0 8px;
}

p { margin: 0; }

a { color: var(--accent); }

code {
    font-family: var(--font-mono);
    display: inline-flex;
    font-size: 14px;
    line-height: 135%;
    padding: 4px 8px;
    border-radius: 4px;
    color: var(--heading);
    background: var(--code-bg);
}

.frame {
    width: var(--frame);
    max-width: 100%;
    margin: 0 auto;
    border-inline: 1px solid var(--rule);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
}

.container { padding: 0 32px; }
@media (max-width: 1024px) {
    .container { padding: 0 20px; }
}

.ticks {
    position: relative;
    width: 100%;
    border-top: 1px solid var(--rule);
}
.ticks::before,
.ticks::after {
    content: '';
    position: absolute;
    top: -4.5px;
    border: 5px solid transparent;
}
.ticks::before { left: 0; border-left-color: var(--rule); }
.ticks::after { right: 0; border-right-color: var(--rule); }

header { border-bottom: 1px solid var(--rule); }

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    gap: 24px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--heading);
}
.logo svg { width: 24px; height: 24px; }
.logo h1 {
    font-size: 16px;
    letter-spacing: -0.17px;
    line-height: 125%;
    margin: 0;
}

nav { display: none; }
@media (min-width: 768px) { nav { display: flex; gap: 20px; align-items: center; } }
nav a {
    color: var(--body);
    text-decoration: none;
    font-size: 15px;
    transition: color 0.3s;
}
nav a:hover { color: var(--heading); }

main { flex-grow: 1; }

.button {
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 145%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 5px;
    text-decoration: none;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.button-primary {
    color: var(--accent);
    background: var(--accent-bg);
}
.button-primary:hover { border-color: var(--accent-border); }

.button-secondary {
    color: var(--heading);
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 12px;
}
.button-secondary:hover { box-shadow: var(--shadow); }

#next-steps {
    display: flex;
    border-top: 1px solid var(--rule);
    text-align: left;
}
#next-steps > div {
    flex: 1 1 0;
    padding: 24px 32px;
}
#next-steps .icon {
    margin-bottom: 16px;
    width: 22px;
    height: 22px;
    color: var(--accent);
}
#next-steps > div + div { border-left: 1px solid var(--rule); }
#next-steps ul {
    list-style: none;
    padding: 0;
    display: flex;
    gap: 8px;
    margin: 20px 0 0;
}
#next-steps ul a {
    color: var(--heading);
    font-size: 15px;
    border-radius: 6px;
    background: var(--surface);
    display: flex;
    padding: 6px 12px;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: box-shadow 0.3s;
}
#next-steps ul a:hover { box-shadow: var(--shadow); }

@media (max-width: 1024px) {
    #next-steps { flex-direction: column; text-align: center; }
    #next-steps > div { padding: 20px; }
    #next-steps > div + div { border-left: none; border-top: 1px solid var(--rule); }
    #next-steps ul { margin-top: 16px; flex-wrap: wrap; justify-content: center; }
    #next-steps li { flex: 1 1 calc(50% - 8px); }
    #next-steps ul a { width: 100%; justify-content: center; }
}

footer { border-top: 1px solid var(--rule); }
.footer-bottom {
    padding: 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}
@media (min-width: 768px) {
    .footer-bottom { flex-direction: row; justify-content: space-between; }
}
@media (max-width: 1024px) {
    .footer-bottom { padding: 20px; }
}
.footer-bottom p { color: var(--body); font-size: 15px; }
</style>
</head>
<body>
  <div class="frame">
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo"><h1>{{ project_name }}</h1></a>
                <nav><a href="/">Home</a><a href="/admin/">Admin</a>{% if app_name %}<a href="/{{ app_name }}/">{{ app_name|title }}</a>{% endif %}<a href="/api/schema/swagger-ui/">API Docs</a></nav>
            </div>
        </div>
    </header>
    <main class="container">
        <h1>API Documentation</h1>
        <p>Explore the browsable API, the generated schema and the admin from one place.</p>
    </main>
  </div>
</body>
</html>
