[project]
name = "my_shop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.2",
    "argon2-cffi",
    "whitenoise",
    "gunicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "django-htmx",
    "django-allauth",
    "structlog",
    "django-structlog",
    "sentry-sdk",
    "djangorestframework",
    "drf-spectacular",
    "drf-spectacular-sidecar",
    "django-stubs-ext>=6.1,<6.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Ruff's defaults are E4/E7/E9, F, B, UP and RUF; extend-select adds to them
# rather than replacing them, so new default rules arrive with new releases.
extend-select = [
    "A",
    "ANN",
    "ARG",
    "C4",
    "DJ",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "I",
    "LOG",
    "N",
    "PL",
    "PTH",
    "RET",
    "S",
    "SIM",
    "TC",
    "TID",
    "TRY",
    "W",
]
ignore = ["SIM102"]

[tool.ruff.lint.per-file-ignores]
# Split settings modules are built on "from .base import *", which is the
# documented Django pattern. F403 flags the star import and F405 flags every
# name that comes through it, so both have to be off here — otherwise names
# like env and BASE_DIR are reported as possibly undefined in each file.
# The star import also carries a noqa, which this configuration makes
# redundant but a project without these per-file ignores still needs.
"*/settings/*.py" = ["F403", "F405", "RUF100"]
"**/models.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/api.py" = ["RUF012", "ARG002"]
# django-ninja passes the request to every operation as its first argument,
# whether the body reads it or not, so ARG001 is reported for each write
# endpoint that only needs its path parameter.
"**/api/*.py" = ["RUF012", "ARG002", "ARG001"]
"**/management/commands/*.py" = ["ARG002"]
# DEBUG is a Django setting name, so the property that derives it keeps that
# spelling; N802 would otherwise demand debug() and break every reader.
"**/conf.py" = ["N802"]
# manage.py is written by django-admin; its deferred import and error message
# are the documented form.
"manage.py" = ["PLC0415", "TRY003", "EM101"]
# Django calls a context processor with the request whether it reads it or not.
"**/context_processors.py" = ["ARG001"]
# Django dictates the signature of a view and of an error handler; the request
# and the exception are passed whether the handler reads them or not.
"**/views.py" = ["ARG001", "RUF012"]
# assert is how Django's TestCase reports failures.
"**/tests*.py" = ["S101", "RUF012"]
"**/tests/*.py" = ["S101", "RUF012"]
# Migrations are generated by Django; they are not ours to restyle.
"**/migrations/*.py" = ["ALL"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["my_shop", "core", "accounts", "catalog"]

[tool.ruff.lint.flake8-type-checking]
# These classes and decorators read annotations at runtime, so the imports the
# annotations name stay real imports rather than moving under "if TYPE_CHECKING:".
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.mypy]
python_version = "3.13"
strict = true
# strict does not ban explicit Any; this does. Nothing this project generates
# needs one — object, TypedDict or a pydantic model says more in every case.
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]

[tool.django-stubs]
django_settings_module = "my_shop.settings.test"

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Django writes migrations; they are not ours to type.
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# "from .base import *" is the documented Django settings layout, and
# no_implicit_reexport reports every name it carries as undefined. Both patterns
# are listed because settings is a single module until the multi-env split
# turns it into a package.
module = ["*.settings", "*.settings.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# These packages ship no type information.
module = ["allauth.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "django-browser-reload",
    "mypy",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "djangorestframework-stubs",
    "pre-commit",
    "ruff",
    "djlint",
]
