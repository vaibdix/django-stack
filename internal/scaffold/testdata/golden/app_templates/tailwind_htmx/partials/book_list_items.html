{% for book in books %}
<article id="book-{{ book.id }}" class="panel card-hover p-5">
    <div class="flex items-start justify-between gap-4">
        <h3 class="m-0">{{ book.title }}</h3>
        <code>${{ book.price }}</code>
    </div>
    <div class="mt-3 space-y-1.5 text-body">
        <div class="flex items-center justify-between gap-4 border-b border-rule pb-2">
            <span>Author</span>
            <span class="text-right text-heading">{{ book.author }}</span>
        </div>
        <div class="flex items-center justify-between gap-4 border-b border-rule pb-2">
            <span>ISBN</span>
            <span class="text-right text-heading">{{ book.isbn }}</span>
        </div>
        <div class="flex items-center justify-between gap-4">
            <span>Published</span>
            <span class="text-right text-heading">{{ book.publication_date }}</span>
        </div>
    </div>
    <div class="mt-4 flex gap-2">
        <a href="{% url 'catalog:book_edit' book.id %}" class="button button-secondary flex-1">Edit</a>
        <button hx-post="{% url 'catalog:book_delete' book.id %}" hx-target="closest article" hx-swap="outerHTML" hx-confirm="Delete this book?" class="button button-primary flex-1">Delete</button>
    </div>
</article>
{% empty %}
<div class="panel col-span-full px-6 py-10 text-center">
    <p class="text-body">No books match your search.</p>
</div>
{% endfor %}
