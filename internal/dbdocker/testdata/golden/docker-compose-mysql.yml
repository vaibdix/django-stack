name: my_shop

services:
  db:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:?set DB_PORT in .env}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    configs:
      - source: grant-test-database
        target: /docker-entrypoint-initdb.d/10-grant-test-database.sql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  mysql_data:

configs:
  grant-test-database:
    content: |
      GRANT ALL PRIVILEGES ON `test_${DB_NAME}`.* TO '${DB_USER}'@'%';
