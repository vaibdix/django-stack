version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - noctx
    - bodyclose

    - gosec

    - cyclop
    - gocognit

    - gocritic
    - revive
    - unparam
    - misspell
    - whitespace
    - exhaustive
    - recvcheck
    - containedctx
    - contextcheck
    - depguard
    - forcetypeassert
    - wastedassign
    - dupl
    - nolintlint
    - gochecknoinits
    - gochecknoglobals
    - paralleltest
    - tparallel
    - modernize

  settings:
    depguard:
      rules:
        engine-without-terminal:
          files:
            - "**/internal/catalog/**"
            - "**/internal/config/**"
            - "**/internal/version/**"
            - "**/internal/pypi/**"
            - "**/internal/releases/**"
            - "**/internal/command/**"
            - "**/internal/pyenv/**"
            - "**/internal/dbdocker/**"
            - "**/internal/assets/**"
            - "**/internal/blueprint/**"
            - "**/internal/graph/**"
            - "**/internal/scaffold/**"
            - "**/internal/render/**"
            - "**/internal/report/**"
            - "**/internal/port/**"
            - "**/internal/adapter/**"
          deny:
            - pkg: charm.land
              desc: the engine has no terminal dependencies
            - pkg: github.com/charmbracelet
              desc: the engine has no terminal dependencies
        leaves:
          files:
            - "**/internal/catalog/**"
            - "**/internal/config/**"
            - "**/internal/version/**"
          deny:
            - pkg: github.com/vaibdix/django-stack/internal/pypi
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/releases
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/command
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/pyenv
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/dbdocker
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/assets
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/blueprint
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/scaffold
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/report
              desc: catalog, config and version depend on no other internal package except catalog and version
            - pkg: github.com/vaibdix/django-stack/internal/tui
              desc: catalog, config and version depend on no other internal package except catalog and version
        scaffold-without-tui:
          files:
            - "**/internal/scaffold/**"
          deny:
            - pkg: github.com/vaibdix/django-stack/internal/tui
              desc: the engine does not know about the interface
        ports-are-interfaces:
          files:
            - "**/internal/port/**"
          deny:
            - pkg: os
              desc: a port describes the machine and does not touch it
            - pkg: net
              desc: a port describes the machine and does not touch it
            - pkg: github.com/vaibdix/django-stack/internal/adapter
              desc: adapters implement ports, not the other way round
            - pkg: github.com/vaibdix/django-stack/internal/command
              desc: a port describes the machine and does not touch it
            - pkg: github.com/vaibdix/django-stack/internal/dbdocker
              desc: a port describes the machine and does not touch it
            - pkg: github.com/vaibdix/django-stack/internal/pypi
              desc: a port describes the machine and does not touch it
        render-is-pure:
          files:
            - "**/internal/render/**"
            - "!$test"
          deny:
            - pkg: os
              desc: rendering reads and writes nothing; the executor in scaffold does
            - pkg: os/exec
              desc: rendering runs no commands
            - pkg: net
              desc: rendering opens no connections
            - pkg: crypto/rand
              desc: randomness comes from the Rand port
            - pkg: github.com/vaibdix/django-stack/internal/command
              desc: rendering runs no commands
            - pkg: github.com/vaibdix/django-stack/internal/port
              desc: rendering does not reach the machine
            - pkg: github.com/vaibdix/django-stack/internal/adapter
              desc: rendering does not reach the machine
            - pkg: github.com/vaibdix/django-stack/internal/releases
              desc: rendering does not query the index
            - pkg: github.com/vaibdix/django-stack/internal/report
              desc: rendering reports nothing
            - pkg: github.com/vaibdix/django-stack/internal/scaffold
              desc: the executor imports render, never the other way round
        pure-blueprint:
          files:
            - "**/internal/blueprint/**"
          deny:
            - pkg: github.com/vaibdix/django-stack/internal/command
              desc: a blueprint runs no commands
            - pkg: os/exec
              desc: a blueprint runs no commands
            - pkg: net
              desc: a blueprint opens no connections

    exhaustive:
      default-signifies-exhaustive: true

    cyclop:
      max-complexity: 23

    gocognit:
      min-complexity: 30

    govet:
      enable-all: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    gosec:
      excludes:
        - G204
        - G702
        - G703
        - G304
        - G301
        - G306

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
      - path: test/
        linters:
          - paralleltest
          - tparallel
      - linters:
          - gochecknoglobals
        text: "^(accentPillStyle|accentStyle|addOns|analyzer|apiAddOns|authNotices|AuthPages|catalogTOML|bodyStyle|boolAddOns|chipStyle|colorAccent|colorAccentBG|colorBorder|colorCodeBG|colorDanger|colorForcing|colorHeading|colorSuccess|colorSurface|colorText|commit|dangerStyle|databases|date|deployedEnvironments|directives|djangoApps|DjangoCompatibilityRules|djangoLoginPage|engines|ErrorPages|exitKeys|formTheme|headingStyle|heroNarrow|heroWide|installedModules|lightBackground|loaded|maskPatterns|masks|minimumEngineAPI|NPM|pillStyle|plainAuthStyle|Pnpm|railStyle|rendered|scaffoldOwnedNames|secretMarkers|selectKeys|skipDirs|skipFile|specifierOperators|stacks|stdlibModules|stepsOnce|subtleStyle|successStyle|tailwindAuthStyle|templates|unavailableStyle|update|version) is a global variable"
      - path: test/e2e/
        linters:
          - noctx
      - path: _test\.go
        linters:
          - gosec
          - unparam
      - path: tools/matrix/indexproxy\.go
        linters:
          - gosec
        text: "G70[45]"
      - path: internal/render/migrations\.go
        linters:
          - gosec
        text: "G(401|501)"

formatters:
  enable:
    - gofmt
    - goimports
