version: "2"

linters:
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - noctx
    - bodyclose

    # Security
    - gosec

    # Complexity
    - gocyclo

    # Style and simplification
    - gocritic
    - revive
    - unparam         # dead parameters — F9 class
    - misspell

  settings:
    gocyclo:
      min-complexity: 30

    govet:
      enable-all: false

    # revive's default rule set includes `exported` and `package-comments`,
    # which require doc comments this repository deliberately does not have.
    # Leaving `rules` empty enables the defaults, so the set is listed
    # explicitly: everything revive normally runs, minus those two.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    gosec:
      excludes:
        - G204
        - G702
        - G703
        - G304
        - G301
        - G306

  exclusions:
    rules:
      - path: test/e2e/
        linters:
          - noctx
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
