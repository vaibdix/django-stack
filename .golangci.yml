version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - noctx
    - bodyclose

    - gosec

    - gocyclo

    - gocritic
    - revive
    - unparam
    - misspell
    - whitespace
    - exhaustive

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    gocyclo:
      min-complexity: 30

    govet:
      enable-all: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    gosec:
      excludes:
        - G204
        - G702
        - G703
        - G304
        - G301
        - G306

  exclusions:
    rules:
      - path: test/e2e/
        linters:
          - noctx
      - path: _test\.go
        linters:
          - gosec
          - unparam
      - path: tools/matrix/indexproxy\.go
        linters:
          - gosec
        text: "G70[45]"

formatters:
  enable:
    - gofmt
    - goimports
